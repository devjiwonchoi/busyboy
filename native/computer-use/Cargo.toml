[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/macos", "crates/helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
core = { path = "crates/core" }
macos = { path = "crates/macos" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
