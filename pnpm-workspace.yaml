# This is a single-package repository. The file exists so pnpm treats this
# folder as the workspace root and stops here instead of walking up into a
# parent workspace: a worktree created inside another checkout that has its
# own pnpm-workspace.yaml once installed into, and rewrote the lockfile of,
# that checkout. pnpm 11 also reads its project settings only from this file.
packages:
  - .

# Install scripts pnpm may run; everything else is blocked.
allowBuilds:
  # Downloads the Electron binary.
  electron: true
  # Comes with electron-builder for Squirrel installers, which are not built.
  electron-winstaller: false
  # Installs its platform binary for bundling the main process.
  esbuild: true
  # Uses its prebuild or compiles from source when there is none (Linux).
  node-pty: true

# Electron 45.3.2 was newer than the configured minimum release age when it
# was pinned for this app; pnpm added the exemption so it could be installed.
minimumReleaseAgeExclude:
  - electron@45.3.2
