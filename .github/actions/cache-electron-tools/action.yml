name: Cache Electron and electron-builder
description: >-
  Restores the Electron binary cache and electron-builder's tool cache
  (NSIS, 7zip, and the Electron zip). Each release was downloading them again.

runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: |
        arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
        {
          echo "arch=$arch"
          echo "paths<<EOF"
          case "$RUNNER_OS" in
            Windows)
              printf '%s\n' "$LOCALAPPDATA/electron/Cache" "$LOCALAPPDATA/electron-builder/Cache"
              ;;
            macOS)
              printf '%s\n' "$HOME/Library/Caches/electron" "$HOME/Library/Caches/electron-builder"
              ;;
            *)
              cache="${XDG_CACHE_HOME:-$HOME/.cache}"
              printf '%s\n' "$cache/electron" "$cache/electron-builder"
              ;;
          esac
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: electron-tools-${{ runner.os }}-${{ steps.paths.outputs.arch }}-${{ hashFiles('package.json') }}
        restore-keys: |
          electron-tools-${{ runner.os }}-${{ steps.paths.outputs.arch }}-
