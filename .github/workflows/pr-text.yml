name: Pull request text

# A separate workflow so editing the title or description reruns only this check, not the whole CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, v2, "v2-*", "cursor/**"]

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  english:
    name: English only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - run: git fetch --no-tags origin "${{ github.base_ref }}"
      - run: node scripts/check-no-korean.mts "origin/${{ github.base_ref }}"
        env:
          # Passed as env, never interpolated into the script, so PR text cannot inject shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
