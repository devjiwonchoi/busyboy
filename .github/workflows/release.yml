name: Release

# Cuts the next patch release of the macOS app from main:
#   pnpm release            (or Actions → Release → Run workflow)
# The first release is v0.0.0; each later one bumps the latest vX.Y.Z tag's
# patch. Installed apps pick the release up through the in-app updater.
on:
  workflow_dispatch:

# Each run computes its version from the tags the previous run published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Resolve next patch version
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            version="0.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous: $latest)"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder signs with the Developer ID .p12 (CSC_LINK) and
      # notarizes with an App Store Connect API key, which it reads from a file.
      - name: Build, sign, and notarize DMG and ZIP
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Fail before packaging if any required GitHub Actions secret is missing.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done

          umask 077
          key="$(mktemp "$RUNNER_TEMP/AuthKey.XXXXXX")"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          unset APPLE_API_KEY_P8

          APPLE_API_KEY="$key" node scripts/build-desktop-release.ts --version "${{ steps.version.outputs.version }}" --out release

      # The release stays a draft until every asset is uploaded, so the in-app
      # updater never sees a release without its ZIP.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" release/*.dmg release/*.zip \
            --target "$GITHUB_SHA" \
            --title "BusyBoy $TAG" \
            --generate-notes \
            --draft
          gh release edit "$TAG" --draft=false --latest
