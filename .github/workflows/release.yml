name: Release

# Cuts the next patch release of the macOS and Windows apps from main:
#   pnpm release            (or Actions → Release → Run workflow)
# The first release is v0.0.0; each later one bumps the latest vX.Y.Z tag's
# patch. Installed apps pick the release up through the in-app updater.
# With dry_run, the builds are kept as run artifacts and nothing is published.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but publish nothing (installers stay as run artifacts)
        type: boolean
        default: false

# Each run computes its version from the tags the previous run published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve next patch version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing here pushes with git; don't leave the token on disk.
          persist-credentials: false

      - id: version
        name: Resolve next patch version
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            version="0.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous: $latest)"

  macos:
    name: Build macOS release
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # The signing secrets live in the "release" environment, which only main
    # can deploy to (Settings → Environments → release).
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Computer Use helper builds with cargo, like the resource monitor.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-05
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            native/computer-use -> target
            native/resource-monitor -> target

      - name: Check release secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Fail before packaging if any required GitHub Actions secret is missing.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in the release environment (Settings → Environments → release)"
              exit 1
            fi
          done

      # The build signs the Computer Use helper before electron-builder sets up
      # its own keychain from CSC_LINK, so put the same Developer ID in a
      # keychain of our own first. The helper's caller check needs team 5PA4R2B5FF.
      - name: Import Developer ID for the Computer Use helper
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/busyboy-helper-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12="$(mktemp "$RUNNER_TEMP/developer-id.XXXXXX")"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -f pkcs12 -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          # The intermediate that issued the Developer ID, so the identity counts as valid.
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL --retry 3 -o "$intermediate" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$intermediate" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing

          # Sign by certificate hash so a second copy of the identity can't make codesign ambiguous.
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: .*\(5PA4R2B5FF\)"/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::CSC_LINK has no Developer ID Application identity for team 5PA4R2B5FF"
            exit 1
          fi
          echo "BUSYBOY_CU_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "HELPER_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # electron-builder signs with the Developer ID .p12 (CSC_LINK) and
      # notarizes with an App Store Connect API key, which it reads from a file.
      # --computer-use bundles the helper, already signed above, and keeps
      # electron-builder from re-signing it; notarization covers both.
      - name: Build, sign, and notarize DMG and ZIP
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          umask 077
          key="$(mktemp "$RUNNER_TEMP/AuthKey.XXXXXX")"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          unset APPLE_API_KEY_P8

          APPLE_API_KEY="$key" node scripts/build-desktop-release.ts --version "${{ needs.version.outputs.version }}" --out release --computer-use

      - name: Remove helper signing keychain
        if: always()
        run: |
          if [ -n "${HELPER_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$HELPER_SIGNING_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  # Same packaging as upstream T3 Code: one NSIS installer per arch, each built
  # natively on its own runner. Signed with Azure Trusted Signing when all of
  # its secrets are in the release environment, unsigned otherwise.
  windows:
    name: Build Windows release (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The resource monitor builds with cargo.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-05
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/resource-monitor -> target

      # electron-builder reads AZURE_TENANT_ID, AZURE_CLIENT_ID and
      # AZURE_CLIENT_SECRET itself; the build script reads the rest. With none
      # of them set, the installer is built unsigned.
      - name: Build NSIS installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: node scripts/build-desktop-release.ts --version "${{ needs.version.outputs.version }}" --arch "${{ matrix.arch }}" --out release

      # Each arch writes its own latest.yml; the publish job merges them.
      - name: Name the update manifest by arch
        run: mv release/latest.yml "release/latest-${{ matrix.arch }}.yml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest-*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, macos, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # electron-updater on Windows reads one latest.yml and picks the
      # installer whose name contains its arch.
      - name: Merge Windows update manifests
        run: |
          node scripts/merge-windows-update-manifests.ts release/latest.yml release/latest-x64.yml release/latest-arm64.yml
          rm release/latest-x64.yml release/latest-arm64.yml

      # The release stays a draft until every asset is uploaded, so the in-app
      # updater never sees a release without its ZIP or latest.yml.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" release/*.dmg release/*.zip release/*.exe release/*.blockmap release/latest.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BusyBoy $TAG" \
            --generate-notes \
            --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
