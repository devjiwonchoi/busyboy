name: Windows arm64 timing (temporary)

# Temporary: measures the Windows release build with different disk setups.
# Unsigned, publishes nothing. Removed before the pull request is opened.
on:
  push:
    branches: [jiwon/windows-arm64-build-time]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: windows-11-arm, variant: exclusions, exclude: true, filter: false }
          - { arch: arm64, runner: windows-11-arm, variant: no-mobile, exclude: false, filter: true }
          - { arch: arm64, runner: windows-11-arm, variant: exclusions+no-mobile, exclude: true, filter: true }
          - { arch: x64, runner: windows-latest, variant: exclusions+no-mobile, exclude: true, filter: true }
    defaults:
      run:
        shell: bash
    steps:
      - name: Defender status
        shell: pwsh
        run: Get-MpComputerStatus | Select-Object AMServiceEnabled,RealTimeProtectionEnabled,IsTamperProtected | Format-List

      # Real-time scanning can't be turned off on windows-11-arm (tamper protection),
      # but it can skip the folders and tools the install writes with.
      - name: Exclude build folders from Defender
        if: matrix.exclude
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, $env:USERPROFILE, $env:TEMP
          Add-MpPreference -ExclusionProcess node.exe, tar.exe, zstd.exe, cargo.exe, rustc.exe
          (Get-MpPreference).ExclusionPath
          (Get-MpPreference).ExclusionProcess

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: |
          if [ "${{ matrix.filter }}" = true ]; then
            pnpm install --frozen-lockfile --filter '!@t3tools/mobile'
          else
            pnpm install --frozen-lockfile
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-05
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/resource-monitor -> target

      - name: Build NSIS installer
        run: node scripts/build-desktop-release.ts --version 0.0.999 --arch "${{ matrix.arch }}" --out release

      - name: List artifacts
        run: ls -la release

      - name: Install and launch the app
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/BusyBoy-Setup-*-${{ matrix.arch }}.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter BusyBoy.exe | Select-Object -First 1
          if (-not $exe) { throw "BusyBoy.exe not installed" }
          Write-Host "Installed at $($exe.FullName)"
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = '0x{0:X4}' -f [BitConverter]::ToUInt16($bytes, $pe + 4)
          Write-Host "PE machine: $machine (0xAA64 = arm64, 0x8664 = x64)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          $alive = Get-Process -Name BusyBoy -ErrorAction SilentlyContinue
          if (-not $alive) { throw "BusyBoy exited within 30s (exit code $($proc.ExitCode))" }
          Write-Host "BusyBoy running after 30s: $($alive.Count) processes"
          $alive | Stop-Process -Force
