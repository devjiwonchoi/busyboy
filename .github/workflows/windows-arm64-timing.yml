name: Windows arm64 timing (temporary)

# Temporary: runs the release.yml Windows job's steps (unsigned, version
# 0.0.999, publishes nothing), then installs and launches the result.
# Removed before the pull request is opened.
on:
  push:
    branches: [jiwon/windows-arm64-build-time]

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      pnpm_config_verify_deps_before_run: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: ${{ matrix.arch == 'x64' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!@t3tools/mobile'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-05
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/resource-monitor -> target

      - name: Build NSIS installer
        run: node scripts/build-desktop-release.ts --version 0.0.999 --arch "${{ matrix.arch }}" --out release

      - name: Name the update manifest by arch
        run: mv release/latest.yml "release/latest-${{ matrix.arch }}.yml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest-*.yml
          if-no-files-found: error

      # Not in release.yml: checks the installer on this runner's own arch.
      - name: Install and launch the app
        shell: pwsh
        run: |
          Get-ChildItem release | Format-Table Name, Length
          $installer = Get-ChildItem release/BusyBoy-Setup-*-${{ matrix.arch }}.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter BusyBoy.exe | Select-Object -First 1
          if (-not $exe) { throw "BusyBoy.exe not installed" }
          Write-Host "Installed at $($exe.FullName)"
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = '0x{0:X4}' -f [BitConverter]::ToUInt16($bytes, $pe + 4)
          Write-Host "PE machine: $machine (0xAA64 = arm64, 0x8664 = x64)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          $alive = Get-Process -Name BusyBoy -ErrorAction SilentlyContinue
          if (-not $alive) { throw "BusyBoy exited within 30s (exit code $($proc.ExitCode))" }
          Write-Host "BusyBoy running after 30s: $($alive.Count) processes"
          $alive | Stop-Process -Force
